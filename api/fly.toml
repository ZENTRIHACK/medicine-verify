app = "medicine-verify-api"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3001"
  DB_FILE = "/data/prod.db"
  # chain/ and ocr/ are not shipped in this image; "real" would crash at require time.
  CHAIN_MODE = "stub"
  OCR_MODE = "stub"

[mounts]
  source = "db_data"
  destination = "/data"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
